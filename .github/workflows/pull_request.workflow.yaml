name: Pull request checks

on: [pull_request]

jobs:
  test:
    name: Lint, type tests, types-only check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check the package payload
        run: npm pack --dry-run
